<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информатика 5-сынып | Интерактивті Тест</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-grad1: #6366f1;
            --bg-grad2: #a855f7;
            --card-bg: #ffffff;
            --text: #1f2937;
            --correct-bg: #d1fae5;
            --correct-color: #065f46;
            --wrong-bg: #fee2e2;
            --wrong-color: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad1), var(--bg-grad2));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 750px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #6b7280;
            font-size: 0.95rem;
        }

        /* Variant selector */
        .variant-picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .variant-btn {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .variant-btn:hover {
            background: #e0e7ff;
            border-color: var(--primary);
        }

        .variant-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 15px;
        }

        .badge {
            background-color: #eff6ff;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e5e7eb;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f5f3ff;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: #10b981 !important;
            color: var(--correct-color) !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: #ef4444 !important;
            color: var(--wrong-color) !important;
        }

        /* Feedback Modal/Box */
        .feedback-box {
            display: none;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.3s ease;
        }

        .feedback-box.show {
            display: flex;
        }

        .feedback-box.correct-box {
            background-color: var(--correct-bg);
            color: var(--correct-color);
            border: 1px solid #a7f3d0;
        }

        .feedback-box.wrong-box {
            background-color: var(--wrong-bg);
            color: var(--wrong-color);
            border: 1px solid #fecaca;
        }

        .feedback-emoji {
            font-size: 2.5rem;
            animation: bounce 0.5s ease;
        }

        .feedback-info h4 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .feedback-info p {
            font-size: 0.9rem;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: background 0.2s ease;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        /* Results Screen */
        .results-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .results-emoji {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        .results-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .score-num {
            font-size: 2.2rem;
            font-weight: 800;
        }

        .score-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .restart-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        .restart-btn:hover {
            background: #059669;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.4rem; }
            .question-text { font-size: 1.05rem; }
            .variant-btn { padding: 6px 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💻 Информатика 5-сынып</h1>
        <p class="subtitle">Интерактивті тест кешені (Мемлекеттік оқу бағдарламасы бойынша)</p>
    </header>

    <!-- Нұсқа таңдау батырмалары -->
    <div class="variant-picker" id="variantPicker">
        <button class="variant-btn active" onclick="switchVariant(1)">1-нұсқа</button>
        <button class="variant-btn" onclick="switchVariant(2)">2-нұсқа</button>
        <button class="variant-btn" onclick="switchVariant(3)">3-нұсқа</button>
        <button class="variant-btn" onclick="switchVariant(4)">4-нұсқа</button>
        <button class="variant-btn" onclick="switchVariant(5)">5-нұсқа</button>
    </div>

    <!-- Тест экраны -->
    <div id="quizScreen">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-meta">
            <span id="variantLabel">Нұсқа: 1</span>
            <span id="questionCounter">Сұрақ: 1 / 10</span>
        </div>

        <div class="badge" id="objectiveBadge">Оқу мақсаты: 5.4.1.1</div>

        <div class="question-text" id="questionText">Сұрақ жүктелуде...</div>

        <div class="options-grid" id="optionsContainer">
            <!-- Жауап нұсқалары дианмикалы түрде орнатылады -->
        </div>

        <!-- Кері байланыс смайликтері бар блок -->
        <div class="feedback-box" id="feedbackBox">
            <div class="feedback-emoji" id="feedbackEmoji">😃</div>
            <div class="feedback-info">
                <h4 id="feedbackTitle">Дұрыс!</h4>
                <p id="feedbackDesc">Өте жақсы, дұрыс жауапты таптың!</p>
            </div>
        </div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Келесі сұрақ ➔</button>
        <div style="clear: both;"></div>
    </div>

    <!-- Нәтиже экраны -->
    <div class="results-screen" id="resultsScreen">
        <div class="results-emoji" id="resultsEmoji">🏆</div>
        <h2 class="results-title" id="resultsTitle">Тест аяқталды!</h2>
        <p id="resultsSubtitle">Сенің көрсеткішің:</p>

        <div class="score-circle">
            <div class="score-num" id="scoreNum">10 / 10</div>
            <div class="score-label" id="scorePercent">100% ұпай</div>
        </div>

        <p id="resultsFeedback" style="margin-bottom: 20px; font-weight: 500;"></p>

        <button class="restart-btn" onclick="restartQuiz()">Қайтадан өту 🔄</button>
    </div>
</div>

<script>
    // Тест сұрақтарының базасы (5 нұсқа х 10 сұрақ)
    const quizDatabase = {
        1: [
            {
                obj: "5.4.1.1 Эргономика және жұмыс орны",
                q: "Компьютерде жұмыс істегенде экран мен көздің арасындағы дұрыс арақашықтық қанша болуы керек?",
                options: ["10-20 см", "50-70 см", "100-150 см", "5-10 см"],
                correct: 1,
                exp: "Дұрыс! Экран мен көздің арасы 50-70 см (қол созым қашықтықта) болуы тиіс."
            },
            {
                obj: "5.4.1.1 Эргономика және жұмыс орны",
                q: "Компьютер алдында отырғанда арқаны қалай ұстаған дұрыс?",
                options: ["Алға қарай қатты еңкейіп", "Қисайып, бір жаққа сүйеніп", "Түзу, орындық арқалығына сүйеніп", "Бүкірейіп"],

            {
                obj: "5.2.1.1 Ақпарат түрлері және екілік код",

                options: ["Ондық код", "Екілік код (0 және 1)", "Мәтіндік код", "Рим цифрлары"],
                correct: 1,
                exp: "Жарайсың! Компьютер ақпаратты 0 және 1 цифрларынан тұратын екілік кодта өңдейді."
            },
            {
                obj: "5.2.1.1 Ақпарат түрлері және екілік код",

                options: ["Ұзын әңгіме", "Негізгі кілт сөздер", "Кез келген сөздер", "Тек смайликтер"],
                correct: 1,
                exp: "Дұрыс! Іздеу сұранысы қысқа әрі негізгі кілт сөздерден тұруы керек."

            {

                options: ["Тырнақшалар (\" \")", "Жақшалар ( )", "Торғай белгісі (#)", "Доллар белгісі (\$)"],

            {

    let currentVariant = 1;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // Смайликтер топтамасы
    const correctEmojis = ["😃", "🎉", "👏", "⭐", "🤩", "🥳"];
    const wrongEmojis = ["🤔", "😔", "💡", "🧐", "❌"];

    function initQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        
        document.getElementById("quizScreen").style.display = "block";
        document.getElementById("resultsScreen").style.display = "none";
        
        loadQuestion();
    }

    function switchVariant(variantNum) {
        currentVariant = variantNum;
        
        // Батырмалардың белсенділігін ауыстыру
        const btns = document.querySelectorAll(".variant-btn");
        btns.forEach((btn, idx) => {
            if (idx + 1 === variantNum) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });

        initQuiz();
    }

    function loadQuestion() {
        answered = false;
        const currentQuiz = quizDatabase[currentVariant];
        const qData = currentQuiz[currentQuestionIndex];

        // UI жаңарту
        document.getElementById("variantLabel").innerText = `Нұсқа: ${currentVariant}`;
        document.getElementById("questionCounter").innerText = `Сұрақ: ${currentQuestionIndex + 1} / ${currentQuiz.length}`;
        document.getElementById("objectiveBadge").innerText = `Оқу мақсаты: ${qData.obj}`;
        document.getElementById("questionText").innerText = qData.q;

        // Прогресс бар
        const progressPercent = ((currentQuestionIndex) / currentQuiz.length) * 100;
        document.getElementById("progressBar").style.width = `${progressPercent}%`;

        // Жасырын блоктарды реттеу
        document.getElementById("feedbackBox").classList.remove("show", "correct-box", "wrong-box");
        document.getElementById("nextBtn").style.display = "none";

        // Нұсқаларды шығару
        const optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = "";

        qData.options.forEach((optText, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `<b style="margin-right:10px;">${String.fromCharCode(65 + index)})</b> ${optText}`;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const currentQuiz = quizDatabase[currentVariant];
        const qData = currentQuiz[currentQuestionIndex];
        const optionBtns = document.querySelectorAll(".option-btn");

        // Батырмаларды бұғаттау
        optionBtns.forEach(btn => btn.disabled = true);

        const feedbackBox = document.getElementById("feedbackBox");
        const feedbackEmoji = document.getElementById("feedbackEmoji");
        const feedbackTitle = document.getElementById("feedbackTitle");
        const feedbackDesc = document.getElementById("feedbackDesc");

        if (selectedIndex === qData.correct) {
            score++;
            optionBtns[selectedIndex].classList.add("correct");
            
            // Рандомды қуанышты смайлик
            const randomEmoji = correctEmojis[Math.floor(Math.random() * correctEmojis.length)];
            feedbackEmoji.innerText = randomEmoji;
            feedbackTitle.innerText = "Өте жақсы! Дұрыс жауап!";
            feedbackDesc.innerText = qData.exp;
            
            feedbackBox.className = "feedback-box show correct-box";
        } else {
            optionBtns[selectedIndex].classList.add("wrong");
            optionBtns[qData.correct].classList.add("correct");

            // Рандомды ойлы смайлик
            const randomEmoji = wrongEmojis[Math.floor(Math.random() * wrongEmojis.length)];
            feedbackEmoji.innerText = randomEmoji;
            feedbackTitle.innerText = "Қате жауап!";
            feedbackDesc.innerText = qData.exp;

            feedbackBox.className = "feedback-box show wrong-box";
        }

        document.getElementById("nextBtn").style.display = "block";
    }

    function nextQuestion() {
        const currentQuiz = quizDatabase[currentVariant];
        currentQuestionIndex++;

        if (currentQuestionIndex < currentQuiz.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quizScreen").style.display = "none";
        document.getElementById("resultsScreen").style.display = "block";

        const total = quizDatabase[currentVariant].length;
        const percent = Math.round((score / total) * 100);

        document.getElementById("scoreNum").innerText = `${score} / ${total}`;
        document.getElementById("scorePercent").innerText = `${percent}% ұпай`;

        const rEmoji = document.getElementById("resultsEmoji");
        const rTitle = document.getElementById("resultsTitle");
        const rFeedback = document.getElementById("resultsFeedback");

        if (percent >= 90) {
            rEmoji.innerText = "🏆";
            rTitle.innerText = "Ғажап нәтиже!";
            rFeedback.innerText = "Сен Информатика пәнін өте үздік меңгеріпсің! Жарайсың! 🌟";
        } else if (percent >= 70) {
            rEmoji.innerText = "👍";
            rTitle.innerText = "Жақсы нәтиже!";
            rFeedback.innerText = "Білімің өте жақсы, бірақ тағы да жетілдіруге болады! 😊";
        } else if (percent >= 50) {
            rEmoji.innerText = "🤔";
            rTitle.innerText = "Орташа нәтиже";
            rFeedback.innerText = "Тақырыптарды қайталап, тестті қайта өтуге кеңес береміз! 📚";
        } else {
            rEmoji.innerText = "💡";
            rTitle.innerText = "Тағы да талпынып көр!";
            rFeedback.innerText = "Бағдарлама материалын қайта қарап шығып, қайтадан бағыңды сына! 🦾";
        }
    }

    function restartQuiz() {
        initQuiz();
    }

    // Бастапқы іске қосу
    initQuiz();
</script>
